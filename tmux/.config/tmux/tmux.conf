### Keys
unbind r
bind r source-file "$HOME/.dotfiles/tmux/.config/tmux/tmux.conf"
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.dotfiles/tmux/.config/tmux/plugins"

# New leader key
unbind C-b
set-option -g prefix C-e
bind-key C-e send-prefix

set -g mouse on
setw -g mode-keys vi

# Vim motions for movements through panes
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Vim motions for copying in selection mode (Prefix + [)
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Close all panes except active one

bind-key a kill-pane -a

# don't rename windows automatically
set-option -g allow-rename off

### Running the programs at the start

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh psql mysql sqlite3 nvim btop'

### Settings for nvim

set-option -sg escape-time 10
set-option -g focus-events on

### Set ZSH as default

set -g default-shell /bin/zsh

### Theme config 
# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position top 
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=yellow'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'

# clock mode
setw -g clock-mode-colour yellow

### Plugins

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'aserowy/tmux.nvim'
#===========================TMUX NVIM OPTIONS==========================
# navigation
set -g @tmux-nvim-navigation true
set -g @tmux-nvim-navigation-cycle true
set -g @tmux-nvim-navigation-keybinding-left 'C-h'
set -g @tmux-nvim-navigation-keybinding-down 'C-j'
set -g @tmux-nvim-navigation-keybinding-up 'C-k'
set -g @tmux-nvim-navigation-keybinding-right 'C-l'

# resize
set -g @tmux-nvim-resize true
set -g @tmux-nvim-resize-step-x 1
set -g @tmux-nvim-resize-step-y 1
set -g @tmux-nvim-resize-keybinding-left 'M-h'
set -g @tmux-nvim-resize-keybinding-down 'M-j'
set -g @tmux-nvim-resize-keybinding-up 'M-k'
set -g @tmux-nvim-resize-keybinding-right 'M-l'
#=======================================================================

### Key bindings for tmux restore
#Key bindings
#prefix + Ctrl-s - save
#prefix + Ctrl-r - restore

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.dotfiles/tmux/.config/tmux/tpm/tpm'

bind C-r confirm-before -p "Restore last tmux session? (y/n)" \
"run-shell '#{HOME}/.dotfiles/tmux/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh'"

