CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
enable_audio_bell no
font_size 11.0
window_padding_width 4
include theme.conf
cursor_trail 1
#background_opacity 0.60
#hide_window_decorations yes
#confirm_os_window_close 0

# initially empty, to be configured by user and remains static
include userprefs.conf

# Start tmux automatically if not inside tmux
shell /bin/sh -c "tmux attach-session || tmux new-session"

# Note: as userprefs.conf is included at the end, settings configured in this file will override the defaults

#### KEYMAPS
#Ctrl + Shift + = -> zoom in
#Ctrl + Shift + - -> zoom out
#Ctrl + Shift + backspace -> restore font size
#Ctrl + Shift + F11 -> toggle fullscreen
#Ctrl + Shift + delete -> reset the terminal
#Ctrl + Shift + F5 -> reload kitty.conf 
